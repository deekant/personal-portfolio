name: Mirror published Webflow site

# Fired by the Cloudflare Worker relay whenever you hit Publish in Webflow.
# You can also trigger it manually from the Actions tab (workflow_dispatch)
# to force a re-mirror without republishing.
on:
  repository_dispatch:
    types: [webflow-publish]
  workflow_dispatch: {}

# Needed so the workflow can push the mirrored files back to this repo.
permissions:
  contents: write

jobs:
  mirror-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install wget
        run: sudo apt-get update && sudo apt-get install -y wget

      - name: Clear previous mirrored output
        run: |
          find . -maxdepth 1 \
            ! -name '.' \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'cloudflare-worker' \
            ! -name 'README-setup.md' \
            -exec rm -rf {} +

      - name: Mirror the published site
        env:
          SITE_URL: ${{ secrets.WEBFLOW_SITE_URL }}
        run: |
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --span-hosts \
            --no-parent \
            --no-host-directories \
            --directory-prefix=. \
            --domains="$(echo "$SITE_URL" | sed -E 's#https?://([^/]+).*#\1#'),cdn.prod.website-files.com" \
            "$SITE_URL" || true

      - name: Commit and push mirrored site
        run: |
          git config user.name "webflow-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes since last publish - nothing to commit."
          else
            git commit -m "Mirror Webflow publish - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push --force
          fi
