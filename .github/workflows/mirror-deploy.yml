name: Mirror published Webflow site

# Fired by the Cloudflare Worker relay whenever you hit Publish in Webflow.
# You can also trigger it manually from the Actions tab (workflow_dispatch)
# to force a re-mirror without republishing.
on:
  repository_dispatch:
    types: [webflow-publish]
  workflow_dispatch: {}

# Needed so the workflow can push the mirrored files back to this repo.
permissions:
  contents: write

jobs:
  mirror-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install wget
        run: sudo apt-get update && sudo apt-get install -y wget

      - name: Mirror the published site into a scratch dir
        env:
          SITE_URL: ${{ secrets.WEBFLOW_SITE_URL }}
        run: |
          rm -rf /tmp/mirror
          mkdir -p /tmp/mirror
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --span-hosts \
            --no-parent \
            --no-host-directories \
            --directory-prefix=/tmp/mirror \
            --domains="$(echo "$SITE_URL" | sed -E 's#https?://([^/]+).*#\1#'),cdn.prod.website-files.com" \
            "$SITE_URL" || true

      # Pages serves straight from the repo root (destination_dir "/"), so the
      # mirror lands at root too. rsync --delete keeps stale Webflow-generated
      # files from piling up, but the excludes below are the pipeline's own
      # files plus anything hand-added to the repo (e.g. proposals/) - never
      # touched by this sync regardless of what's in the mirror.
      - name: Sync mirror into repo root
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='cloudflare-worker/' \
            --exclude='README-setup.md' \
            --exclude='proposals/' \
            /tmp/mirror/ ./

      - name: Commit and push mirrored site
        run: |
          git config user.name "webflow-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- . ':!.github' ':!cloudflare-worker' ':!README-setup.md' ':!proposals'
          if git diff --cached --quiet; then
            echo "No changes since last publish - nothing to commit."
          else
            git commit -m "Mirror Webflow publish - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git fetch origin main
            git merge origin/main --no-edit -X ours -m "Merge remote changes into mirror"
            git push origin HEAD:main
          fi
