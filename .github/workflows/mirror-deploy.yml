name: Mirror published Webflow site

# Fired by the Cloudflare Worker relay whenever you hit Publish in Webflow.
# You can also trigger it manually from the Actions tab (workflow_dispatch)
# to force a re-mirror without republishing.
on:
  repository_dispatch:
    types: [webflow-publish]
  workflow_dispatch: {}

# Needed so the workflow can push the mirrored files back to this repo.
permissions:
  contents: write

jobs:
  mirror-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Webflow's published HTML already references every asset (CSS, JS,
      # fonts, images) by absolute https://cdn.prod.website-files.com URL.
      # Those chunks are loaded dynamically at runtime by Webflow's bundle,
      # so a recursive/page-requisites mirror can't discover them all and
      # ends up rewriting some references to local copies that 404 (broken
      # site). Saving the page verbatim, with the CDN links left absolute,
      # avoids that entirely - it's also exactly how this repo's root
      # files already looked before this workflow existed.
      - name: Fetch the published page verbatim
        env:
          SITE_URL: ${{ secrets.WEBFLOW_SITE_URL }}
        run: |
          curl -fsSL "$SITE_URL" -o index.html
          curl -fsSL "${SITE_URL%/}/robots.txt" -o robots.txt || true

      # Webflow's runtime JS injects its "Made in Webflow" badge as
      # <a class="w-webflow-badge"> client-side (it's never in the
      # published HTML, so a mirror alone never catches it) - hide it
      # on every publish.
      - name: Hide the Webflow badge
        run: |
          sed -i 's|</head>|<style>.w-webflow-badge{display:none!important}</style></head>|' index.html

      - name: Commit and push
        run: |
          git config user.name "webflow-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html robots.txt
          if git diff --cached --quiet; then
            echo "No changes since last publish - nothing to commit."
          else
            git commit -m "Mirror Webflow publish - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git fetch origin main
            git merge origin/main --no-edit -X ours -m "Merge remote changes into mirror"
            git push origin HEAD:main
          fi
