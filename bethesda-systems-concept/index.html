<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bethesda Systems Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#f4f1ec; --muted:rgba(244,241,236,.66); --line:rgba(244,241,236,.16); --blue:#2aa6ec; --panel:rgba(12,15,22,.58); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#070a10; color:var(--ink); font-family:Inter, system-ui, sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .shade-top { position:fixed; inset:0; pointer-events:none; background:linear-gradient(180deg, rgba(7,10,16,.55), rgba(7,10,16,0) 22%), linear-gradient(0deg, rgba(7,10,16,.75), rgba(7,10,16,0) 34%); }
  a, button { color:inherit; font:inherit; }
  a:focus-visible, button:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }

  header { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:28px 40px; z-index:5; }
  header img { height:30px; width:auto; display:block; }
  nav { display:flex; gap:36px; align-items:center; font-size:14px; }
  nav a { text-decoration:none; opacity:.82; transition:opacity .3s; }
  nav a:hover { opacity:1; }
  .btn { position:relative; overflow:hidden; display:inline-block; background:var(--ink); color:#070a10; opacity:1 !important; padding:13px 20px; font-weight:500; text-decoration:none; border:0; cursor:pointer; }
  .btn span { position:relative; z-index:1; transition:color .4s; }
  .btn::before { content:""; position:absolute; inset:0; background:var(--blue); transform:translateY(101%); transition:transform .45s cubic-bezier(.7,0,.2,1); }
  .btn:hover::before, .btn:focus-visible::before { transform:none; }
  .btn:hover span, .btn:focus-visible span { color:#fff; }

  /* info card in the sky band */
  .card { position:fixed; right:40px; bottom:40px; width:420px; padding:22px 22px 20px; background:var(--panel); backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3); border-radius:16px; box-shadow:inset 0 0 0 1px var(--line); z-index:4; }
  .card h2 { font:600 24px/1.1 "Inter Tight"; letter-spacing:-.02em; margin-bottom:10px; text-wrap:balance; }
  .card p { font-size:14.5px; line-height:1.55; color:var(--muted); text-wrap:pretty; text-wrap:balance; }
  .card p strong { color:var(--ink); font-weight:500; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .tags span { font:600 12px "Inter Tight"; padding:5px 9px; border-radius:999px; box-shadow:inset 0 0 0 1px var(--line); }
  .controls { display:flex; flex-wrap:wrap; gap:6px; margin-top:16px; }
  .controls button { border:0; cursor:pointer; padding:9px 13px; border-radius:10px; background:rgba(255,255,255,.08); font-size:13px; font-weight:500; transition:background .25s; }
  .controls button:hover { background:rgba(255,255,255,.15); }
  .controls button[aria-pressed="true"] { background:var(--ink); color:#070a10; }
  .card .more { display:inline-block; margin-top:16px; font-size:13px; font-weight:500; text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px; }
  .card .more:hover { border-color:var(--ink); }
  .card { transition:height .55s cubic-bezier(.22,1,.36,1); overflow:hidden; }
  .card .body { transition:opacity .45s cubic-bezier(.22,1,.36,1), transform .55s cubic-bezier(.22,1,.36,1), filter .45s; }
  .card .body.swap { opacity:0; transform:translateY(10px); filter:blur(6px); }
  .card .close { position:absolute; right:12px; top:12px; width:30px; height:30px; border-radius:50%; border:0; background:rgba(255,255,255,.08); cursor:pointer; font-size:16px; line-height:1; display:none; }
  .card.service .close { display:block; }

  svg.link { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:3; }

  .spot { position:fixed; left:0; top:0; width:34px; height:34px; margin:-17px 0 0 -17px; border:0; background:none; cursor:pointer; z-index:3; }
  .spot::before { content:""; position:absolute; inset:11px; border-radius:50%; background:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.28), 0 0 18px rgba(255,255,255,.5); transition:background .3s, box-shadow .3s, transform .3s; }
  .spot::after { content:""; position:absolute; inset:5px; border-radius:50%; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6); animation:pulse 2.4s infinite; }
  .spot:hover::before { transform:scale(1.25); }
  .spot[aria-pressed="true"]::before { background:var(--blue); box-shadow:0 0 0 3px rgba(42,166,236,.35), 0 0 22px rgba(42,166,236,.9); }
  .spot span { position:absolute; left:50%; bottom:100%; transform:translate(-50%, 4px); white-space:nowrap; font:500 12.5px Inter; padding:6px 10px; border-radius:999px; background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:inset 0 0 0 1px var(--line); opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; }
  .spot:hover span, .spot:focus-visible span { opacity:1; transform:translate(-50%, -2px); }
  @keyframes pulse { 0% { transform:scale(.6); opacity:1; } 100% { transform:scale(1.5); opacity:0; } }

  .bottom { position:fixed; left:0; right:0; bottom:0; z-index:4; pointer-events:none; }
  .type { padding:0 40px 32px; width:calc(100% - 480px); }
  .type h1 { font-family:"Inter Tight"; font-weight:600; letter-spacing:-.055em; line-height:.86; white-space:nowrap; }
  .type .mask { display:block; overflow:hidden; padding-bottom:.1em; margin-bottom:-.1em; }
  .type .ln { display:inline-block; transform:translateY(110%); transition:transform 1.1s cubic-bezier(.16,1,.3,1); }
  .type .mask + .mask .ln { transition-delay:.09s; }
  .type h1.in .ln { transform:none; }
  .type h1.out .ln { transform:translateY(-110%); transition-duration:.45s; transition-timing-function:cubic-bezier(.55,0,.75,.2); }
  .type h1.out .mask + .mask .ln { transition-delay:.05s; }
  .type h1.reset .ln { transition:none; transform:translateY(110%); }

  .fade { opacity:0; transition:opacity 1.1s; }
  .fade.in { opacity:1; }

  @media (max-width:900px) {
    header { padding:18px 20px; } nav a:not(.btn) { display:none; }
    .card { left:16px; right:16px; width:auto; top:78px; bottom:auto; padding:16px; }
    .card h2 { font-size:20px; } .card p { font-size:13.5px; }
        .type { padding:0 14px 16px; width:auto; }
  }
  @media (prefers-reduced-motion:reduce) { .type .ln, .fade, .card .body, .btn::before { transition:none !important; } .spot::after { animation:none; } }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A timber house at dusk in the forest. Each service plays a live demo over the photo."></canvas>
<div class="shade-top"></div>
<svg class="link" aria-hidden="true"><line id="ln" stroke="rgba(244,241,236,.55)" stroke-width="1" /><circle id="lnDot" r="3" fill="#f4f1ec" /></svg>

<header class="fade">
  <a href="#" aria-label="Bethesda Systems home"><img src="logos/bs-logo.svg" alt="Bethesda Systems" width="501" height="78"></a>
  <nav aria-label="Main"><a href="#">Projects</a><a href="#">Services</a><a href="#">Platforms</a><a href="#">Showroom</a><a class="btn" href="#"><span>Book a consultation</span></a></nav>
</header>

<section class="card fade" id="card" aria-live="polite">
  <button class="close" id="close" aria-label="Back to overview">×</button>
  <div class="body" id="cardBody"></div>
</section>

<div id="spots"></div>

<div class="bottom">
  <div class="type"><h1 id="title" aria-label="Every room on cue"><span class="mask"><span class="ln">Every room</span></span><span class="mask"><span class="ln">on cue</span></span></h1></div>
</div>

<script>
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const IW = 1672, IH = 941;
const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- zones traced on the photo (image pixels) ----------
const ZONES = {
  soffit: [[222, 392, 1400, 447]],
  living: [[355, 443, 777, 658]],
  center: [[777, 443, 892, 658]],
  lounge: [[892, 443, 1240, 658]],
  walls:  [[208, 395, 357, 692], [1238, 395, 1414, 692]],
  deck:   [[135, 650, 1565, 724], [230, 505, 470, 690]],
};
const BAYS = [[355, 465], [465, 572], [572, 675], [675, 777], [777, 892], [892, 998], [998, 1240]].map(([a, b], i) => ({ x0: a, x1: b, zone: i < 4 ? 'living' : i === 4 ? 'center' : 'lounge' }));
const GLASS_TOP = 444, GLASS_BOT = 656;
const SCREEN = { x0: 588, x1: 764, y0: 462, h: 108 };
const SPEAKERS = { living: [560, 452], lounge: [1120, 452], deck: [760, 700] };
const AP = [980, 421];
const CAM = [1392, 458];
const DEVICES = [[676, 520, 'TV'], [560, 452, 'Speaker'], [1300, 640, 'Phone'], [1392, 458, 'Camera'], [1060, 600, 'Laptop'], [330, 560, 'Keypad']];
const TREES = [[1512, 660, 1.1], [1588, 650, .9], [1452, 655, .7], [70, 650, .9], [150, 655, .8]];
const PATH = [[420, 772], [640, 800], [880, 818], [1120, 792], [1330, 772]];

// ---------- state ----------
const S = {
  light: { soffit: 0, living: 0, center: 0, lounge: 0, walls: 0 },  // targets
  shades: BAYS.map(() => 0),
  screen: 0, movie: 0, landscape: 0, wifi: 0, security: 0,
  audio: { living: 0, lounge: 0, deck: 0 },
};
const C = JSON.parse(JSON.stringify(S)); // current (eased)

// ---------- canvas + photo ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const img = new Image(); img.src = 'house.jpg';
let dpr = 1, view = { s: 1, ox: 0, oy: 0 };
const ptr = { x: 0, y: 0, tx: 0, ty: 0 };
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
}
addEventListener('resize', () => { resize(); fit(); });
resize();
function computeView() {
  const over = reduced ? 1 : 1.035, W = innerWidth, H = innerHeight;
  const s = Math.max(W / IW, H / IH) * over;
  const focusX = W < 900 ? 800 : IW / 2;
  let ox = clamp(W / 2 - focusX * s, W - IW * s, 0), oy = (H - IH * s) / 2;
  if (W >= 900) oy = clamp(H - 330 - 722 * s, -H * .2, oy); // deck edge ends above the card
  ox += ptr.x * -12; oy += ptr.y * -8;
  view = { s, ox, oy };
}
const toScreen = (x, y) => [view.ox + x * view.s, view.oy + y * view.s];

// pre-baked "lights off" layers: the photo darkened and cooled, cut to each zone with soft edges
const zoneDark = {};
let linen;
function bake() {
  const base = document.createElement('canvas'); base.width = IW; base.height = IH;
  const b = base.getContext('2d'); b.drawImage(img, 0, 0);
  const d = b.getImageData(0, 0, IW, IH), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], bl = p[i + 2], l = .3 * r + .59 * g + .11 * bl;
    p[i] = (l * .7 + r * .3) * .17; p[i + 1] = (l * .7 + g * .3) * .2; p[i + 2] = (l * .7 + bl * .3) * .3 + 6;
  }
  b.putImageData(d, 0, 0);
  // faint twilight reflection on the glass when the room is dark
  const gr = b.createLinearGradient(0, GLASS_TOP, 0, GLASS_BOT); gr.addColorStop(0, 'rgba(120,140,190,.16)'); gr.addColorStop(1, 'rgba(60,70,100,.04)');
  b.fillStyle = gr; b.fillRect(355, GLASS_TOP, 885, GLASS_BOT - GLASS_TOP);
  for (const [k, rects] of Object.entries(ZONES)) {
    const z = document.createElement('canvas'); z.width = IW; z.height = IH; const zc = z.getContext('2d');
    zc.shadowColor = '#000'; zc.shadowBlur = 14; zc.shadowOffsetX = 5000; zc.fillStyle = '#000';
    rects.forEach(([x0, y0, x1, y1]) => zc.fillRect(x0 - 5000, y0, x1 - x0, y1 - y0));
    zc.shadowColor = 'transparent'; zc.globalCompositeOperation = 'source-in'; zc.drawImage(base, 0, 0);
    zoneDark[k] = z;
  }
  const l = document.createElement('canvas'); l.width = l.height = 64; const lc = l.getContext('2d');
  lc.fillStyle = '#fff'; lc.fillRect(0, 0, 64, 64);
  for (let i = 0; i < 64; i += 2) { lc.fillStyle = `rgba(0,0,0,${Math.random() * .08})`; lc.fillRect(i, 0, 1, 64); }
  for (let i = 0; i < 300; i++) { lc.fillStyle = `rgba(0,0,0,${Math.random() * .06})`; lc.fillRect(Math.random() * 64, Math.random() * 64, 1, 2); }
  linen = ctx.createPattern(l, 'repeat');
}

// ---------- effects ----------
const rings = [];
let ringT = 0, wifiT = 0, t0 = performance.now();
function drawShades() {
  BAYS.forEach((bay, i) => {
    const s = C.shades[i]; if (s < .004) return;
    const h = (GLASS_BOT - GLASS_TOP) * s, lv = C.light[bay.zone];
    ctx.save();
    ctx.fillStyle = `rgb(${lerp(34, 236, lv)},${lerp(37, 204, lv)},${lerp(46, 162, lv)})`;
    ctx.globalAlpha = .96; ctx.fillRect(bay.x0 + 2, GLASS_TOP, bay.x1 - bay.x0 - 4, h);
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = linen; ctx.fillRect(bay.x0 + 2, GLASS_TOP, bay.x1 - bay.x0 - 4, h);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    const g = ctx.createLinearGradient(0, GLASS_TOP, 0, GLASS_TOP + h); g.addColorStop(0, 'rgba(0,0,0,.25)'); g.addColorStop(.12, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(bay.x0 + 2, GLASS_TOP, bay.x1 - bay.x0 - 4, h);
    ctx.fillStyle = '#16171a'; ctx.fillRect(bay.x0 + 2, GLASS_TOP + h - 3, bay.x1 - bay.x0 - 4, 3);
    ctx.restore();
  });
  ctx.fillStyle = '#121214'; BAYS.forEach(b => { if (b.x0 > 360) ctx.fillRect(b.x0 - 2.5, GLASS_TOP, 5, (GLASS_BOT - GLASS_TOP) * Math.max(C.shades[BAYS.indexOf(b)], C.shades[BAYS.indexOf(b) - 1] || 0)); });
}
function drawScreen(t) {
  const d = C.screen; if (d < .004) return;
  const { x0, x1, y0 } = SCREEN, h = SCREEN.h * d, w = x1 - x0;
  ctx.save();
  ctx.fillStyle = '#121212'; ctx.fillRect(x0 - 6, y0 - 5, w + 12, 6);
  const m = C.movie, flick = .78 + .14 * Math.sin(t * 9.1) * Math.sin(t * 2.3) + .08 * Math.sin(t * 31);
  if (m > .01) {
    const g = ctx.createLinearGradient(x0, y0, x1, y0 + h);
    g.addColorStop(0, `hsla(${205 + 25 * Math.sin(t * .4)},75%,${50 * flick}%,1)`);
    g.addColorStop(.55, `hsla(${190 + 30 * Math.sin(t * .3 + 1)},60%,${30 * flick}%,1)`);
    g.addColorStop(1, `hsla(${25 + 15 * Math.sin(t * .5)},70%,${40 * flick}%,1)`);
    ctx.fillStyle = '#d9d9d6'; ctx.fillRect(x0, y0, w, h);
    ctx.globalAlpha = m; ctx.fillStyle = g; ctx.fillRect(x0, y0, w, h);
    ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = m * .35 * flick;
    const rg = ctx.createRadialGradient(676, 520, 10, 676, 560, 330); rg.addColorStop(0, 'rgba(90,150,255,1)'); rg.addColorStop(1, 'rgba(90,150,255,0)');
    ctx.beginPath(); ctx.rect(355, 443, 537, 260); ctx.clip(); ctx.fillStyle = rg; ctx.fillRect(300, 400, 700, 340);
  } else { ctx.fillStyle = '#d9d9d6'; ctx.globalAlpha = .9; ctx.fillRect(x0, y0, w, h); }
  ctx.restore();
}
function drawAudio(dt) {
  ringT += dt;
  if (!reduced && ringT > .75) {
    ringT = 0;
    for (const k of Object.keys(SPEAKERS)) if (C.audio[k] > .5) rings.push({ k, t: 0 });
  }
  ctx.save(); ctx.beginPath(); ctx.rect(205, 395, 1210, 330); ctx.clip();
  ctx.globalCompositeOperation = 'screen';
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.t += dt; const p = r.t / 2.6; if (p >= 1) { rings.splice(i, 1); continue; }
    const [x, y] = SPEAKERS[r.k], rad = 8 + p * (r.k === 'deck' ? 520 : 230), a = Math.sin(p * Math.PI) * .55;
    ctx.strokeStyle = `rgba(255,236,214,${a})`; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(x, y, rad, rad * (r.k === 'deck' ? .12 : .62), 0, 0, Math.PI * 2); ctx.stroke();
  }
  for (const k of Object.keys(SPEAKERS)) if (C.audio[k] > .02) {
    const [x, y] = SPEAKERS[k];
    const g = ctx.createRadialGradient(x, y, 0, x, y, 22); g.addColorStop(0, `rgba(255,240,220,${.9 * C.audio[k]})`); g.addColorStop(1, 'rgba(255,240,220,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 22, y - 22, 44, 44);
  }
  ctx.restore();
}
function drawLandscape(t) {
  const v = C.landscape; if (v < .01) return;
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const [x, y, s] of TREES) {
    // warm light lifting the trunk and lower canopy: overlay keeps the bark and needles visible
    ctx.save(); ctx.translate(x, y - 190 * s); ctx.scale(.32, 1); ctx.globalCompositeOperation = 'overlay';
    const o = ctx.createRadialGradient(0, 0, 0, 0, 0, 230 * s); o.addColorStop(0, `rgba(255,185,110,${v})`); o.addColorStop(1, 'rgba(255,190,120,0)');
    ctx.fillStyle = o; ctx.fillRect(-230 * s, -230 * s, 460 * s, 460 * s); ctx.restore();
    ctx.save(); ctx.translate(x, y - 120 * s); ctx.scale(.22, 1);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 160 * s); g.addColorStop(0, `rgba(255,190,120,${.45 * v})`); g.addColorStop(1, 'rgba(255,190,120,0)');
    ctx.fillStyle = g; ctx.fillRect(-160 * s, -160 * s, 320 * s, 320 * s); ctx.restore();
    const r = ctx.createRadialGradient(x, y, 0, x, y, 30 * s); r.addColorStop(0, `rgba(255,220,170,${.9 * v})`); r.addColorStop(1, 'rgba(255,220,170,0)');
    ctx.fillStyle = r; ctx.fillRect(x - 30 * s, y - 30 * s, 60 * s, 60 * s);
  }
  for (const [x, y] of PATH) {
    const r = ctx.createRadialGradient(x, y, 0, x, y, 70); r.addColorStop(0, `rgba(255,210,150,${v})`); r.addColorStop(.15, `rgba(255,200,140,${.55 * v})`); r.addColorStop(1, 'rgba(255,200,140,0)');
    ctx.save(); ctx.translate(x, y); ctx.scale(1, .38); ctx.translate(-x, -y); ctx.fillStyle = r; ctx.fillRect(x - 70, y - 70, 140, 140); ctx.restore();
    ctx.fillStyle = `rgba(255,236,200,${v})`; ctx.fillRect(x - 2, y - 7, 4, 7);
  }
  const g = ctx.createLinearGradient(0, 712, 0, 740); g.addColorStop(0, `rgba(255,190,120,${.35 * v})`); g.addColorStop(1, 'rgba(255,190,120,0)');
  ctx.fillStyle = g; ctx.fillRect(150, 714, 1400, 16);
  ctx.restore();
}
function drawWifi(dt) {
  const v = C.wifi; if (v < .01) return;
  wifiT += dt;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 372, IW, IH); ctx.clip(); ctx.globalCompositeOperation = 'screen';
  const [ax, ay] = AP, R = 980, period = 3.2;
  for (let k = 0; k < 3; k++) {
    const p = ((wifiT / period) + k / 3) % 1, rad = 10 + p * R, a = Math.sin(p * Math.PI) * .6 * v;
    ctx.strokeStyle = `rgba(120,200,255,${a})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(ax, ay, rad, rad * .55, 0, 0, Math.PI * 2); ctx.stroke();
  }
  DEVICES.forEach(([x, y]) => {
    const dist = Math.hypot((x - ax), (y - ay) / .55);
    let hit = 0; for (let k = 0; k < 3; k++) { const rad = 10 + (((wifiT / period) + k / 3) % 1) * R; hit = Math.max(hit, 1 - Math.min(1, Math.abs(rad - dist) / 40)); }
    const g = ctx.createRadialGradient(x, y, 0, x, y, 18 + hit * 14); g.addColorStop(0, `rgba(140,215,255,${(.55 + .45 * hit) * v})`); g.addColorStop(1, 'rgba(140,215,255,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 34, y - 34, 68, 68);
  });
  const g = ctx.createRadialGradient(ax, ay, 0, ax, ay, 26); g.addColorStop(0, `rgba(190,235,255,${v})`); g.addColorStop(1, 'rgba(190,235,255,0)');
  ctx.fillStyle = g; ctx.fillRect(ax - 26, ay - 26, 52, 52);
  ctx.restore();
}
function drawSecurity(t) {
  const v = C.security; if (v < .01) return;
  const [cx, cy] = CAM, ang = Math.PI * (.72 + .1 * Math.sin(t * .6)), half = .16, len = 760;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, len); g.addColorStop(0, `rgba(120,200,255,${.4 * v})`); g.addColorStop(1, 'rgba(120,200,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, len, ang - half, ang + half); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#1b1d21'; ctx.beginPath(); ctx.roundRect(cx - 11, cy - 6, 22, 12, 4); ctx.fill();
  ctx.fillStyle = Math.sin(t * 5) > 0 ? `rgba(255,70,60,${v})` : `rgba(255,70,60,${.25 * v})`; ctx.beginPath(); ctx.arc(cx + 6, cy, 2, 0, 7); ctx.fill();
  // motion box on the deck chairs
  const bx0 = 1200, by0 = 592, bx1 = 1392, by1 = 690, c = 14, blink = .6 + .4 * Math.sin(t * 4);

  ctx.stroke();
  ctx.font = '600 13px Inter, sans-serif'; ctx.fillStyle = `rgba(244,241,236,${v})`; ctx.fillText('Motion · Deck', bx0, by0 - 10);
  ctx.fillStyle = `rgba(255,70,60,${v * blink})`; ctx.beginPath(); ctx.arc(bx1 - 40, by0 - 14, 4, 0, 7); ctx.fill();
  ctx.fillStyle = `rgba(244,241,236,${v})`; ctx.fillText('REC', bx1 - 31, by0 - 10);
  ctx.restore();
}

// ---------- render loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now; const t = (now - t0) / 1000;
  const kl = reduced ? 1 : 1 - Math.exp(-dt * 1.9), ks = reduced ? 1 : 1 - Math.exp(-dt * 1.2), kp = reduced ? 1 : 1 - Math.exp(-dt * 4);
  for (const k in S.light) C.light[k] = lerp(C.light[k], S.light[k], kl);
  S.shades.forEach((v, i) => C.shades[i] = lerp(C.shades[i], v, ks));
  for (const k in S.audio) C.audio[k] = lerp(C.audio[k], S.audio[k], kl);
  for (const k of ['screen']) C[k] = lerp(C[k], S[k], ks);
  for (const k of ['movie', 'landscape', 'wifi', 'security']) C[k] = lerp(C[k], S[k], kl);
  ptr.x = lerp(ptr.x, reduced ? 0 : ptr.tx, kp * .5); ptr.y = lerp(ptr.y, reduced ? 0 : ptr.ty, kp * .5);
  computeView();

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#070a10'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (img.complete && zoneDark.soffit) {
    ctx.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.ox, dpr * view.oy);
    ctx.drawImage(img, 0, 0);
    const fade = ctx.createLinearGradient(0, IH - 170, 0, IH); fade.addColorStop(0, 'rgba(7,10,16,0)'); fade.addColorStop(1, 'rgba(7,10,16,1)'); ctx.fillStyle = fade; ctx.fillRect(-50, IH - 170, IW + 100, 172);
    const L = { ...C.light, deck: (C.light.living + C.light.center + C.light.lounge) / 3 * .6 + C.light.walls * .4 };
    for (const k in zoneDark) { const a = Math.pow(1 - clamp(L[k], 0, 1), .6); if (a > .005) { ctx.globalAlpha = a; ctx.drawImage(zoneDark[k], 0, 0); } }
    ctx.globalAlpha = 1;
    drawScreen(t); drawShades(); drawLandscape(t); drawAudio(dt); drawWifi(dt); drawSecurity(t);
  }

  requestAnimationFrame(frame);
}

// ---------- services ----------
const ON = { soffit: 1, living: 1, center: 1, lounge: 1, walls: 1 };
function base() {
  Object.assign(S.light, ON); S.shades = BAYS.map(() => 0);
  S.screen = 0; S.movie = 0; S.landscape = 0; S.wifi = 0; S.security = 0;
  Object.keys(S.audio).forEach(k => S.audio[k] = 0);
}
const timers = [];
function seq(steps, gap = 220) { timers.splice(0).forEach(clearTimeout); steps.forEach((f, i) => timers.push(setTimeout(f, reduced ? 0 : i * gap))); }
function setLights(levels) { seq(['soffit', 'walls', 'lounge', 'center', 'living'].map(k => () => S.light[k] = levels[k] ?? levels.all)); }
function setShades(v) { seq(BAYS.map((_, i) => () => S.shades[i] = v), 110); }
function setAudio(keys) { Object.keys(S.audio).forEach(k => S.audio[k] = keys.includes(k) ? 1 : 0); }

const SERVICES = [

  { id: 'theater', title: ['Home', 'theater'], name: 'Home theater', at: [676, 532],

                'Stop': () => { S.movie = 0; setTimeout(() => S.screen = 0, reduced ? 0 : 400); setLights({ all: 1 }); setAudio([]); } } },

                Disarm: () => { S.security = 0; setLights({ all: 1 }); S.landscape = 0; } } },

      Goodnight: () => { setAudio([]); setShades(1); setTimeout(() => setLights({ soffit: .12, walls: .2, living: 0, center: 0, lounge: 0 }), reduced ? 0 : 1300); setTimeout(() => { S.landscape = .35; }, reduced ? 0 : 2400); } } },

const INTRO = `<h2>Smart homes for the Washington area</h2><p><strong>Lighting, shades, audio, theaters, networks and security</strong> for homes in Bethesda, Potomac, Chevy Chase, Washington DC and Northern Virginia. Designed, installed and serviced by our own team since 2003.</p><div class="tags"><span>Control4</span><span>Savant</span><span>Lutron</span><span>CEDIA</span></div><p style="margin-top:12px">Tap a point on the house to see each system at work.</p>`;

// ---------- UI ----------
const card = document.getElementById('card'), body = document.getElementById('cardBody'), spotsBox = document.getElementById('spots');
let active = null, startTimer, lineDraw = 0;
const lineEnd = { x: 0, y: 0, a: 0 };
const spots = {};
SERVICES.forEach(s => {
  if (s.at) { const b = document.createElement('button'); b.className = 'spot'; b.setAttribute('aria-pressed', 'false'); b.innerHTML = `<span>${s.name}</span>`; b.setAttribute('aria-label', s.name); b.onclick = () => select(s); spotsBox.append(b); spots[s.id] = b; }
});
function render(html, then) {
  const h0 = card.offsetHeight;
  body.classList.add('swap');
  setTimeout(() => {
    body.innerHTML = html; then && then();
    card.style.height = 'auto'; const h1 = card.offsetHeight;
    card.style.height = h0 + 'px'; void card.offsetHeight; card.style.height = h1 + 'px';
    requestAnimationFrame(() => body.classList.remove('swap'));
  }, reduced ? 0 : 280);
}
function select(s) {
  if (active === s) return;
  const had = active; active = s; base(); timers.splice(0).forEach(clearTimeout); clearTimeout(startTimer);
  Object.values(spots).forEach(b => b.setAttribute('aria-pressed', 'false'));
  spots[s.id].setAttribute('aria-pressed', 'true');
  card.classList.add('service'); if (!had) lineDraw = 0;
  const ctrls = Object.keys(s.controls).map(k => `<button aria-pressed="${k === s.start}" data-k="${k}">${k}</button>`).join('');
  render(`<h2>${s.name}</h2><p>${s.text}</p><div class="tags">${s.tags.map(x => `<span>${x}</span>`).join('')}</div><div class="controls">${ctrls}</div>`, () =>
    body.querySelectorAll('.controls button').forEach(b => b.onclick = () => { body.querySelectorAll('.controls button').forEach(x => x.setAttribute('aria-pressed', x === b)); s.controls[b.dataset.k](); }));
  startTimer = setTimeout(() => s.controls[s.start](), reduced ? 0 : had ? 900 : 450);
  setTitle(s.title);
}
document.getElementById('close').onclick = () => {
  active = null; base(); clearTimeout(startTimer); card.classList.remove('service'); render(INTRO); setTitle(['Every room', 'on cue']);
  Object.values(spots).forEach(b => b.setAttribute('aria-pressed', 'false'));
};

const ln = document.getElementById('ln'), lnDot = document.getElementById('lnDot');
function placeOverlay() {
  SERVICES.forEach(s => { if (!s.at) return; const [x, y] = toScreen(...s.at); spots[s.id].style.transform = `translate(${x}px, ${y}px)`; spots[s.id].style.visibility = x < 10 || x > innerWidth - 10 ? 'hidden' : ''; });
  const on = active && innerWidth >= 900, r = card.getBoundingClientRect(), x1 = r.left, y1 = r.top + 24;
  if (on) {
    const [x, y] = toScreen(...active.at), k = reduced ? 1 : .09;
    if (lineEnd.a < .02) { lineEnd.x = x1; lineEnd.y = y1; }
    lineEnd.x += (x - lineEnd.x) * k; lineEnd.y += (y - lineEnd.y) * k;
    lineDraw = Math.min(1, lineDraw + (reduced ? 1 : .025));
  }
  lineEnd.a += ((on ? 1 : 0) - lineEnd.a) * (reduced ? 1 : .1);
  const e = 1 - Math.pow(1 - lineDraw, 3), ex = x1 + (lineEnd.x - x1) * e, ey = y1 + (lineEnd.y - y1) * e;
  ln.setAttribute('x1', x1); ln.setAttribute('y1', y1); ln.setAttribute('x2', ex); ln.setAttribute('y2', ey);
  lnDot.setAttribute('cx', x1); lnDot.setAttribute('cy', y1); ln.style.opacity = lnDot.style.opacity = lineEnd.a;
}

const title = document.getElementById('title'), typeBox = document.querySelector('.type');
function fit() {
  title.style.fontSize = '100px';
  const widest = Math.max(...[...title.querySelectorAll('.ln')].map(l => l.offsetWidth));
  const size = Math.min(100 * (typeBox.clientWidth - (innerWidth < 900 ? 28 : 80)) / widest, innerHeight * (innerWidth < 900 ? .09 : .15));
  title.style.fontSize = size + 'px';
}
let titleTimer;
const fill = ([a, b]) => { title.setAttribute('aria-label', a + ' ' + b); title.querySelectorAll('.ln').forEach((l, i) => l.textContent = i ? b : a); };
function setTitle(lines) {
  if (title.getAttribute('aria-label') === lines.join(' ')) return;
  clearTimeout(titleTimer);
  if (reduced) { fill(lines); fit(); return; }
  title.classList.remove('in'); title.classList.add('out');
  titleTimer = setTimeout(() => { title.classList.remove('out'); title.classList.add('reset'); fill(lines); fit(); void title.offsetWidth; title.classList.remove('reset'); title.classList.add('in'); }, 600);
}
addEventListener('pointermove', e => { ptr.tx = e.clientX / innerWidth * 2 - 1; ptr.ty = e.clientY / innerHeight * 2 - 1; });

// ---------- start: house starts dark, lights come on zone by zone ----------
body.innerHTML = INTRO;
document.fonts.ready.then(fit);

  setTimeout(() => setLights({ all: 1 }), reduced ? 0 : 700);
  setTimeout(() => { title.classList.add('in'); document.querySelectorAll('.fade').forEach((el, i) => setTimeout(() => el.classList.add('in'), reduced ? 0 : i * 150)); fit(); }, reduced ? 0 : 1900);
